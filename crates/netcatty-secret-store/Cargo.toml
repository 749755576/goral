[package]
name = "netcatty-secret-store"
version = "0.1.0"
description = "Secret-safe encrypted SSH key bundle envelopes for Goral"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
fs2 = "0.4"
getrandom = "0.3"
hkdf = "=0.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
