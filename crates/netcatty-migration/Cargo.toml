[package]
name = "netcatty-migration"
version = "0.1.0"
description = "Read-only Netcatty Vault parsing and secret-safe migration previews for Goral"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
netcatty-credentials = { path = "../netcatty-credentials" }
netcatty-secret-store = { path = "../netcatty-secret-store" }
netcatty-vault = { path = "../netcatty-vault" }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
