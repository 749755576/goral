[package]
name = "netcatty-credentials"
version = "0.1.0"
description = "Secret-safe ephemeral and operating-system credential storage for Goral"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
os-credential-tests = []
test-support = []

[dependencies]
netcatty-secret-store = { path = "../netcatty-secret-store" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
