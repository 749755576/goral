<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Goral mark</title>
  <desc id="desc">A stylized goral head with swept twin horns framing a terminal prompt.</desc>
  <defs>
    <linearGradient id="goral-field" x1="84" y1="54" x2="432" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17283F"/>
      <stop offset="0.54" stop-color="#0E192A"/>
      <stop offset="1" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="goral-horns" x1="164" y1="66" x2="348" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#87F0CE"/>
      <stop offset="0.52" stop-color="#42D6B0"/>
      <stop offset="1" stop-color="#5AA9FF"/>
    </linearGradient>
    <linearGradient id="goral-face" x1="218" y1="184" x2="294" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FCFA"/>
      <stop offset="1" stop-color="#C7E4DC"/>
    </linearGradient>
  </defs>

  <g id="badge">
    <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#goral-field)"/>
    <path d="M52 402C128 361 191 365 256 403C321 365 384 361 460 402V462H52Z" fill="#101F31"/>
    <path d="M92 405L165 359L217 395L257 368L314 405L372 371L430 409" fill="none" stroke="#263D55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#7FE7C6" stroke-opacity=".34" stroke-width="4"/>
  </g>

  <g id="goral">
    <path id="left-horn" d="M229 214C197 188 172 149 168 104C166 84 173 67 189 53C190 106 207 153 243 189Z" fill="url(#goral-horns)"/>
    <path id="right-horn" d="M283 214C315 188 340 149 344 104C346 84 339 67 323 53C322 106 305 153 269 189Z" fill="url(#goral-horns)"/>
    <path d="M219 190C198 159 186 123 189 82" fill="none" stroke="#D8FFF2" stroke-width="7" stroke-linecap="round" opacity=".62"/>
    <path d="M293 190C314 159 326 123 323 82" fill="none" stroke="#D8FFF2" stroke-width="7" stroke-linecap="round" opacity=".62"/>

    <path id="left-ear" d="M210 209L158 183C148 178 143 183 149 195L178 243L216 237Z" fill="#43C8AC"/>
    <path id="right-ear" d="M302 209L354 183C364 178 369 183 363 195L334 243L296 237Z" fill="#43C8AC"/>

    <path id="head" d="M256 174C220 174 198 198 192 235C184 284 199 345 227 384C238 399 249 410 256 416C263 410 274 399 285 384C313 345 328 284 320 235C314 198 292 174 256 174Z" fill="url(#goral-face)"/>
    <path d="M256 187L230 239L256 268L282 239Z" fill="#7EDBC3" opacity=".42"/>
    <circle cx="225" cy="256" r="7" fill="#0C1725"/>
    <circle cx="287" cy="256" r="7" fill="#0C1725"/>

    <g id="terminal-prompt" fill="none" stroke="#0B1726" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M219 294L254 321L219 348"/>
      <path d="M278 350H327"/>
    </g>
    <circle cx="327" cy="350" r="6" fill="#42D6B0"/>
