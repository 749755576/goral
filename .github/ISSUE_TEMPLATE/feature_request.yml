name: 功能建议 / Feature request
description: 建议新的工作流或兼容能力
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述使用场景和当前痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的功能和交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果有，请说明你尝试过的替代方式。
  - type: checkboxes
    id: scope
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 本建议不包含密钥、Token、私有主机或其他敏感信息。
          required: true
